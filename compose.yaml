
name: auth-lab

services:
  # MySQL
  mysql:
    image: mysql:8.4
    restart: unless-stopped

    ports:
      - "127.0.0.1:23316:3306"

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      TZ: UTC

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_ci

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD"
          mysql -h 127.0.0.1 -u "$$MYSQL_USER"
          "$$MYSQL_DATABASE" -e "SELECT 1"
          >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Redis
  redis:
    image: redis:8.10.3-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:26379:6379"

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}

    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          REDISCLI_AUTH="$$REDIS_PASSWORD"
          redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot
  backend:
    profiles:
      - full

    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:18080:18080"

    environment:
      SPRING_PROFILES_ACTIVE: docker

      MYSQL_DATABASE: ${MYSQL_DATABASE:?required}
      MYSQL_USER: ${MYSQL_USER:?required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?required}

      REDIS_PASSWORD: ${REDIS_PASSWORD:?required}

      TZ: UTC

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:

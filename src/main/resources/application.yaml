
spring:
  application:
    name: auth-lab

  profiles:
    default: local

  datasource:
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true

  data:
    redis:
      password: ${REDIS_PASSWORD}
      timeout: 3s

  mail:
    from: no-reply@auth-lab.test
    properties:
      "[mail.smtp.auth]": false
      "[mail.smtp.starttls.enable]": false
      "[mail.smtp.connectiontimeout]": 3000
      "[mail.smtp.timeout]": 3000
      "[mail.smtp.writetimeout]": 3000

server:
  port: 18080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always


app:
  mail:
    from: no-reply@auth-lab.test

  email-verification:
    hmac-secret: ${EMAIL_CODE_HMAC_KEY}
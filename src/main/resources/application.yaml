
spring:
  application:
    name: auth-lab

  profiles:
    default: local

  datasource:
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-migration-naming: true

  data:
    redis:
      password: ${REDIS_PASSWORD}
      timeout: 3s

server:
  port: 18080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
